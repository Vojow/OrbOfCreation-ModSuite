version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src"
      - "/tests/OrbModding.GameContractTests"
      - "/tests/OrbModding.GameStubs"
      - "/tests/OrbModding.ProfileTests"
      - "/tests/OrbModding.Tests"
      - "/tools/OrbModding.ServiceCycleTrace"
    schedule:
      interval: "monthly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
