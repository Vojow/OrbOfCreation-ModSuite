name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run game-independent tests
        run: dotnet test tests/OrbModding.Tests/OrbModding.Tests.csproj --configuration Release -p:UseGameStubs=true

      - name: Audit native contract manifest and reflection declarations
        run: dotnet test tests/OrbModding.GameContractTests/OrbModding.GameContractTests.csproj --configuration Release -p:UseGameStubs=true

  repository-hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject proprietary or generated artifacts
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)(bin|obj|bin-stubs|obj-stubs)/' -or
            $_ -match '\.(dll|exe|pdb|sav|pfx|p12|pem|key)$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            exit 1
          }

          $required = @('README.md', 'LICENSE', 'CONTRIBUTING.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md')
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Required public repository file is missing: $path"
              exit 1
            }
          }
