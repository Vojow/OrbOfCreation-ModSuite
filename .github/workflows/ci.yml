name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run game-independent tests
        run: dotnet test tests/OrbModding.Tests/OrbModding.Tests.csproj --configuration Release -p:UseGameStubs=true

      - name: Audit native contract manifest and reflection declarations
        run: dotnet test tests/OrbModding.GameContractTests/OrbModding.GameContractTests.csproj --configuration Release -p:UseGameStubs=true

  headless-behavior:
    name: Headless behavior and performance
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run headless integration and E2E journeys
        run: dotnet test tests/OrbModding.Tests/OrbModding.Tests.csproj --configuration Release -p:UseGameStubs=true --filter "Category=HeadlessIntegration|Category=HeadlessE2E"

      - name: Run deterministic performance simulations
        env:
          OOC_PERFORMANCE_REPORT: ${{ github.workspace }}/artifacts/performance/autobuy-current.json
        run: dotnet test tests/OrbModding.Tests/OrbModding.Tests.csproj --configuration Release -p:UseGameStubs=true --filter "Category=PerformanceSimulation"

      - name: Compare deterministic performance history
        shell: pwsh
        run: tools/check-performance-report.ps1 -ReportPath artifacts/performance/autobuy-current.json

      - name: Retain deterministic performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobuy-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/performance/autobuy-current.json
          if-no-files-found: error
          retention-days: 90

  coverage:
    name: Production coverage floors
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Collect production coverage
        run: dotnet test tests/OrbModding.Tests/OrbModding.Tests.csproj --configuration Release -p:UseGameStubs=true --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory artifacts/coverage

      - name: Enforce coverage floors
        shell: pwsh
        run: |
          $coverage = Get-ChildItem artifacts/coverage -Recurse -Filter coverage.cobertura.xml |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $coverage) { throw 'Coverage report was not produced.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-coverage.ps1 -CoveragePath $coverage.FullName

  repository-hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject proprietary or generated artifacts
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)(bin|obj|bin-stubs|obj-stubs)/' -or
            $_ -match '\.(dll|exe|pdb|sav|pfx|p12|pem|key)$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            exit 1
          }

          $required = @('README.md', 'LICENSE', 'CONTRIBUTING.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md')
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Required public repository file is missing: $path"
              exit 1
            }
          }
