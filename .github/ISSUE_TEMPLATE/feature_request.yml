name: Feature request
description: Suggest a focused mod or tooling improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Orb Automata
        - Orb Mod Config
        - Orb Chronomancer
        - Orb Achievement Resonance
        - Reverse-engineering documentation or tools
        - New mod concept
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: Describe the repetitive task, missing information, or safety problem to solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful behavior and how a player controls it.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Consider saves, resources, queue ownership, other mods, and game-version compatibility.
    validations:
      required: true
