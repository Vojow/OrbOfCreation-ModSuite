name: Feature request
description: Suggest a focused mod or tooling improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Area
      description: The suite ships as one plugin; pick the feature area the request belongs to.
      options:
        - Auto Buy
        - Auto Harvest
        - Auto Cast
        - Auto Concept
        - Spell Leveling
        - Mentor
        - Mod Config UI
        - Reverse-engineering documentation or tools
        - New feature concept
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: Describe the repetitive task, missing information, or safety problem to solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful behavior and how a player controls it.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Consider saves, resources, queue ownership, other mods, and game-version compatibility.
    validations:
      required: true
